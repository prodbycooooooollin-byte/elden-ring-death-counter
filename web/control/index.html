<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Death Counter</title>
  <link rel="icon" href="/game/death-blight.png" type="image/png">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <header class="status-strip" aria-label="Aktueller Stand">
    <div class="who">
      <span class="cap">Gezählt wird</span>
      <span class="who-name" id="who-name">…</span>
      <span class="who-meta" id="who-meta"></span>
    </div>
    <div class="figure">
      <img src="/game/death-blight.png" alt="" onerror="this.remove()">
      <div><span class="cap">Gesamt</span><div class="figure-num num" id="fig-total">0</div></div>
    </div>
    <div class="figure">
      <div><span class="cap">Diese Session</span><div class="figure-num small num" id="fig-session">0</div></div>
    </div>
    <div class="feed" id="feed">
      <span class="feed-state"><i></i><span id="feed-text">Verbinde …</span></span>
      <span class="feed-detail" id="feed-detail"></span>
    </div>
  </header>

  <nav class="menu" id="menu" aria-label="Bereiche"></nav>
  <main class="content" id="content"></main>
  <footer class="keys" id="keys" aria-label="Tastenkürzel"></footer>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
