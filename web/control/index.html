<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141416">
  <title>Death Counter</title>
  <link rel="icon" href="/assets/icon.png" type="image/png">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <a class="skip" href="#content">Zum Inhalt springen</a>
  <aside class="sidebar">
    <div class="app-title">
      <img class="app-mark" src="/assets/icon.png" alt="" width="26" height="26" onerror="this.src='/game/death-blight.png'">
      <span>Death Counter</span>
    </div>
    <nav class="nav" id="menu" aria-label="Bereiche"></nav>

    <section class="now" aria-label="Aktueller Stand">
      <div class="now-feed" id="feed">
        <span class="dot" aria-hidden="true"></span>
        <span id="feed-text">Verbinde …</span>
      </div>
      <div class="now-who">
        <span class="now-name" id="who-name">…</span>
        <span class="now-meta" id="who-meta"></span>
      </div>
      <div class="now-figures">
        <div><span class="now-num num" id="fig-total">0</span><span class="now-cap">Gesamt</span></div>
        <div><span class="now-num num" id="fig-session">0</span><span class="now-cap">Session</span></div>
      </div>
      <div class="now-detail" id="feed-detail"></div>
    </section>
  </aside>

  <main class="content" id="content" tabindex="-1"></main>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
